/* Soft dashboard look: lavender page, floating white cards, pills, round icons, one violet accent. */
:root{--page:#eef0f6;--shell:#f1f2f8;--card:#fff;--soft:#f0f0f8;--bar:#e8e9f3;--on:#14141c;--mute:#7c7e8c;--line:#e4e5ee;--v:#9b5de5;--v2:#c9a8f5;--vs:#f1e9fd;--ink:#0d0d14;--on-ink:#fff;--ok:#1f9d63;--err:#d92d20;--logbg:#f6f6fb}
[data-theme=dark]{--page:#0f0f16;--shell:#14141d;--card:#1d1d29;--soft:#272735;--bar:#2c2c3b;--on:#f4f4f9;--mute:#9a9cad;--line:#30303f;--v:#b083f0;--v2:#6f4bb0;--vs:#2e2445;--ink:#f4f4f9;--on-ink:#0d0d14;--ok:#4cc38a;--err:#ff8a80;--logbg:#16161f;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--page);color:var(--on);font:14px/20px Urbanist,Outfit,Poppins,Nunito,"Noto Sans",Ubuntu,"Segoe UI",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}:focus-visible{outline:2px solid var(--v);outline-offset:2px}h1,h2,h3,p{margin:0}.sp{flex:1}
.shell{height:100%;display:grid;grid-template:72px minmax(0,1fr)/88px minmax(0,1fr);background:var(--shell)}
.top{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 24px;min-width:0}
.logo{width:40px;height:40px;margin-right:16px;flex:none}
.p{height:42px;padding:0 20px;border-radius:21px;background:var(--card);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-weight:500;flex:none;transition:background .15s}.p:hover{background:var(--soft)}.p.on{background:var(--ink);color:var(--on-ink)}.p.v{background:var(--v);color:#fff}
.tabs{display:flex;gap:6px;min-width:0;overflow:auto;scrollbar-width:none}
.tgl{display:flex;background:var(--soft);border-radius:21px;padding:3px;flex:none}.tgl button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}.tgl button.on{background:var(--card);color:var(--on)}
.rail{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0;overflow:auto;scrollbar-width:none}
.r{position:relative;width:48px;height:48px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--mute);flex:none;transition:background .15s,color .15s}.r:hover{color:var(--on)}.r.on{background:var(--v);color:#fff}.r i{position:absolute;right:2px;top:2px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--shell)}
.main{min-width:0;min-height:0;display:flex;flex-direction:column}.scroll{flex:1;overflow:auto;padding:4px 24px 24px 0}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 20px}.hd h1{font-size:36px;line-height:44px;font-weight:500;letter-spacing:-.01em}.hd p{color:var(--mute);margin-top:2px}.hd>div:first-child{min-width:0;flex:1 1 280px}
.round{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none}
.search{display:flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:21px;background:var(--card);width:190px;color:var(--mute)}.search input{border:0;outline:0;background:none;font:inherit;color:var(--on);width:100%;min-width:0}
.dash{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);max-width:1400px}
.card{background:var(--card);border-radius:28px;padding:20px 22px;min-width:0;position:relative}
.stat{display:flex;flex-direction:column;justify-content:flex-end;min-height:178px;text-align:left;width:100%;grid-column:span 1}
.tag{position:absolute;left:20px;top:18px;background:var(--vs);color:var(--on);border-radius:14px;padding:4px 12px;font-size:13px;font-weight:500}.exp{position:absolute;right:18px;top:16px;width:36px;height:36px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--on)}
.stat small{font-size:15px;color:var(--on)}.stat b{font-size:38px;line-height:46px;font-weight:500;letter-spacing:-.01em;overflow-wrap:anywhere}
.w{position:absolute;right:20px;bottom:22px}.w text{font-size:14px;font-weight:600;fill:var(--on)}
.left{display:grid;gap:16px;grid-column:span 1;grid-row:span 2;align-content:start}
.chart{grid-column:span 3}.ctop{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}.ctop h3{font-size:18px;font-weight:500}
.say{display:inline-block;background:var(--soft);border-radius:14px;padding:6px 14px;font-size:14px;margin-bottom:14px}.say em{font-style:normal;color:var(--v);font-weight:600}
.bars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;height:238px;align-items:end}.g{height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;text-align:center;min-width:0;width:100%}.g div{display:flex;justify-content:center;align-items:flex-end;gap:8px;flex:1;min-height:0}.g s{display:block;width:min(38px,32%);border-radius:19px;background:var(--bar);min-height:38px}.g s+s{background:var(--v)}.g span{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.g:hover span{color:var(--v)}
.lg{display:flex;gap:12px;font-size:12px;color:var(--mute)}.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--bar)}.lg i.v{background:var(--v)}
.half{grid-column:span 2}.half.b{grid-column:span 1}.half h3,.card>h3{font-size:18px;font-weight:500;margin-bottom:14px}
.faces{display:flex;margin-bottom:16px}.face{width:48px;height:48px;border-radius:50%;background:var(--vs);color:var(--v);display:grid;place-items:center;margin-right:-6px;border:3px solid var(--card);position:relative;flex:none}.face:hover{z-index:1;background:var(--v);color:#fff}.face.off{background:var(--soft);color:var(--mute)}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tri small{display:block;color:var(--mute);font-size:12px}.tri b{font-size:22px;line-height:28px;font-weight:500;overflow-wrap:anywhere}
.ev{display:flex;gap:10px;padding:7px 0;font-size:13px;line-height:18px}.ev i{width:8px;height:8px;border-radius:50%;background:var(--bar);margin-top:5px;flex:none}.ev.ok i{background:var(--v)}.ev.error i{background:var(--err)}.ev small{display:block;color:var(--mute);font-size:11px}
.frame{flex:1;border:0;width:100%;min-height:0;border-radius:28px 0 0 0;background:var(--card)}.pgbar{display:flex;align-items:center;gap:8px;padding:0 24px 12px 0;flex:none;flex-wrap:wrap}.pgbar b{font-size:22px;font-weight:500;flex:1;min-width:0}
.two{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);max-width:1400px;align-items:start}.vstack{display:grid;gap:16px;min-width:0}
.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.nums div{background:var(--soft);border-radius:18px;padding:12px 14px}.nums b{display:block;font-size:24px;line-height:30px;font-weight:500;overflow-wrap:anywhere}.nums span{font-size:12px;color:var(--mute)}
.step{display:flex;align-items:center;gap:12px;padding:8px 0}.step div{flex:1;min-width:0}.step small{display:block;color:var(--mute)}.step>span{width:26px;height:26px;border-radius:50%;background:var(--vs);color:var(--v);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.links button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:14px}.links button:hover{background:var(--soft)}
.log{background:var(--logbg);border-radius:18px;padding:12px 14px;height:360px;overflow:auto;font:12px/18px ui-monospace,Consolas,monospace;margin:0;white-space:pre-wrap;word-break:break-word}.log time{color:var(--mute);margin-right:8px}
#snack{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:var(--on-ink);padding:12px 18px;border-radius:21px;display:none;max-width:90vw;z-index:50}
#banner{background:var(--err);color:#fff;padding:10px 20px;border-radius:18px;margin:0 24px 12px 0}
#progress{position:fixed;left:0;right:0;top:0;height:3px;background:var(--v);display:none;animation:p 1.2s infinite;z-index:60}#progress.on{display:block}@keyframes p{50%{opacity:.3}}
@media(max-width:1180px){.dash{grid-template-columns:repeat(2,minmax(0,1fr))}.left{grid-column:1/-1;grid-row:auto;grid-template-columns:repeat(3,minmax(0,1fr))}.chart,.half{grid-column:1/-1}.half.b{grid-column:span 1}.two{grid-template-columns:minmax(0,1fr)}}
@media(max-width:700px){.shell{grid-template:64px 56px minmax(0,1fr)/minmax(0,1fr)}.top{padding:0 12px}.logo{margin:0}.rail{flex-direction:row;padding:4px 12px;overflow-x:auto}.scroll{padding:0 12px 12px}.left,.dash{grid-template-columns:minmax(0,1fr)}.half.b{grid-column:1/-1}.tabs .p{padding:0 12px}.search{flex:1}.hd h1{font-size:28px;line-height:34px}.bars{gap:4px}.pgbar{padding:0 12px 10px}#banner{margin:0 12px 10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class="shell"><header class="top" id="top"></header><nav class="rail" id="rail" aria-label="Tools"></nav>
<main class="main"><div id="banner" role="alert" hidden></div><div id="stage" style="flex:1;min-height:0;display:flex;flex-direction:column"></div></main></div>
<div id="progress"></div><div id="snack" role="status"></div>
<script>
const ICON={home:'<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/>',activity:'<path d="M3 12h4l3 8 4-16 3 8h4"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',open:'<path d="M14 4h6v6M20 4l-8 8M10 20H4v-6M4 20l8-8"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',moon:'<path d="M20 15A8 8 0 1 1 9 4a7 7 0 0 0 11 11z"/>',
maps:'<path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>',nykaa:'<path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/>',studio:'<path d="M4 7h11M4 12h7M4 17h11"/><path d="M17 10l3 2-3 2"/>',pdf:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',excalidraw:'<path d="M4 20l1-5L16 4l4 4L9 19z"/><path d="M14 6l4 4"/>'};
const SHORT={maps:'Maps',nykaa:'Nykaa',studio:'Mapper',pdf:'PDF',excalidraw:'Draw'};
const LABEL={running:'Running',starting:'Starting…','setting up':'Installing…',external:'Running outside the Hub',stopped:'Off'};
const svg=(k,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]||ICON.home}</svg>`;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtUp=s=>s<60?s+'s':s<3600?Math.floor(s/60)+'m':Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m';
const num=v=>typeof v==='number'?v.toLocaleString():esc(v);
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
let S=[],E=[],cur=lsGet('hub.cur')||'home',tab='details',query='',logSeq={},logBuf={},key='',lastOk=true;if(cur==='overview')cur='home';
const theme=()=>document.documentElement.dataset.theme;function setTheme(t){document.documentElement.dataset.theme=t;lsSet('theme',t);key='';render()}
function snack(m){const t=$('#snack');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',4000)}
async function post(u){return fetch(u,{method:'POST',headers:{'X-Solist-Hub':'1'}}).then(r=>r.json()).catch(()=>({result:'The Hub is not running'}))}
async function act(id,a){const r=await post(`/api/${a}?id=${id}`);if(r.result&&r.result!=='ok'&&r.result!=='not running')snack(r.result);setTimeout(load,350)}
const busy=t=>t.status==='starting'||t.status==='setting up',live=t=>t.status==='running'||t.status==='external',isOn=t=>t.status!=='stopped'&&t.status!=='external',ready=t=>(t.checks||[]).every(c=>c[1]||!c[5]);
function go(id){cur=id;tab='details';lsSet('hub.cur',id);key='';render();pullLogs()}
function openTool(id){const t=S.find(x=>x.id===id);cur=id;lsSet('hub.cur',id);tab=ready(t)?'page':'details';key='';if(ready(t)&&t.status==='stopped')act(id,'start');render();pullLogs()}
function startAll(){S.forEach(t=>t.status==='stopped'&&ready(t)&&act(t.id,'start'))}function stopAll(){S.forEach(t=>t.pid&&act(t.id,'stop'))}
async function doAction(id,a,how){const r=await post(`/api/action?id=${id}&a=${a}`);if(r.result&&r.result.startsWith('url:'))return window.open(r.result.slice(4),'_blank');if(r.result!=='ok')return snack(r.result||r.error);snack(how==='console'?'Opened in its own window':how==='log'?'Working on it. Follow along in the log.':'Done');setTimeout(load,500)}
function chrome(){const pill=(id,l)=>`<button class="p ${cur===id?'on':''}" onclick="go('${id}')">${l}</button>`;
 const top=`<svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><g fill="var(--v)"><circle cx="9" cy="9" r="8"/><circle cx="31" cy="9" r="8"/><circle cx="9" cy="31" r="8"/><circle cx="31" cy="31" r="8"/></g><path d="M9 9l22 22M31 9L9 31" stroke="var(--v)" stroke-width="7"/></svg><nav class="tabs">${pill('home','Overview')}${pill('activity','Activity')}</nav><span class="sp"></span><div class="tgl"><button class="${theme()==='dark'?'on':''}" onclick="setTheme('dark')" aria-label="Dark">${svg('moon',18)}</button><button class="${theme()==='light'?'on':''}" onclick="setTheme('light')" aria-label="Light">${svg('sun',18)}</button></div>`;
 if($('#top').dataset.h!==top){$('#top').dataset.h=top;$('#top').innerHTML=top}
 const rail=`<button class="r ${cur==='home'?'on':''}" onclick="go('home')" title="Overview" aria-label="Overview">${svg('home')}</button>`+S.map(t=>`<button class="r ${cur===t.id?'on':''}" onclick="go('${t.id}')" title="${esc(t.name)}" aria-label="${esc(t.name)}">${svg(t.id)}${t.status==='stopped'?'':'<i></i>'}</button>`).join('');
 if($('#rail').dataset.h!==rail){$('#rail').dataset.h=rail;$('#rail').innerHTML=rail}}
function set(k,h){if(k===key)return false;const sc=$('#stage .scroll'),p=sc?sc.scrollTop:0,f=document.activeElement&&document.activeElement.id==='q',c=f?document.activeElement.selectionStart:0;key=k;$('#stage').innerHTML=h;const n=$('#stage .scroll');if(n)n.scrollTop=p;if(f){const q=$('#q');if(q){q.focus();q.setSelectionRange(c,c)}}return true}
const ring=(p,l)=>{const r=26,c=2*Math.PI*r;return `<svg class="w" width="68" height="68" viewBox="0 0 68 68" aria-hidden="true"><circle cx="34" cy="34" r="${r}" fill="none" stroke="var(--bar)" stroke-width="8"/><circle cx="34" cy="34" r="${r}" fill="none" stroke="var(--v)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 34 34)"/><text x="34" y="39" text-anchor="middle">${l}</text></svg>`};
const stat=(id,i)=>{const t=S.find(x=>x.id===id),v=t&&t.stats[i];return v?v[1]:'–'};
function home(){const q=query.trim().toLowerCase(),list=S.filter(t=>!q||(t.name+' '+t.desc).toLowerCase().includes(q)),on=S.filter(live),ready1=S.filter(ready).length;
 const events=t=>E.filter(e=>e[1]===t.name),mx=Math.max(1,...S.map(t=>events(t).length)),h=n=>Math.round(n/mx*100);
 const tag=t=>`<span class="tag">${esc(t)}</span>`,exp=id=>`<span class="exp" aria-hidden="true">${svg('open',16)}</span>`;
 const html=`<div class="scroll"><div class="hd"><div><h1>Solist Hub</h1><p>${on.length?`${on.map(t=>esc(t.name)).join(', ')} ${on.length===1?'is':'are'} running right now.`:'Everything is off, so your PC stays free.'}</p></div>
 <label class="search">${svg('search',18)}<input id="q" placeholder="Find a tool" aria-label="Find a tool" value="${esc(query)}" oninput="query=this.value;render()"></label><button class="p" onclick="startAll()">Start all</button><button class="p" onclick="stopAll()">Stop all</button></div>
 <div class="dash"><div class="left">
 <button class="card stat" onclick="go('activity')">${tag('Now')}${exp()}<small>Tools running</small><b>${on.length} of ${S.length}</b>${ring(S.length?on.length/S.length:0,Math.round(S.length?on.length/S.length*100:0)+'%')}</button>
 <button class="card stat" onclick="go('activity')">${tag('Setup')}${exp()}<small>Tools ready</small><b>${ready1} of ${S.length}</b>${ring(S.length?ready1/S.length:0,Math.round(S.length?ready1/S.length*100:0)+'%')}</button>
 <button class="card stat" onclick="go('pdf')">${tag('Solist PDF')}${exp()}<small>PDF tools</small><b>${num(stat('pdf',0))}</b><svg class="w" width="84" height="84" viewBox="0 0 84 84" aria-hidden="true"><rect x="0" y="44" width="16" height="40" rx="8" fill="var(--bar)"/><rect x="22" y="28" width="16" height="56" rx="8" fill="var(--bar)"/><rect x="44" y="4" width="16" height="80" rx="8" fill="var(--v)"/><rect x="66" y="30" width="16" height="54" rx="8" fill="var(--bar)"/></svg></button></div>
 <section class="card chart"><div class="ctop"><span class="p v" style="height:36px;padding:0 16px">Tools</span><span class="sp"></span><span class="lg"><span><i></i>All events</span><span><i class="v"></i>Successful</span></span></div>
 <p class="say">Open any tool below. Bars show <em>Hub events</em> since it <em>started</em>.</p>
 <div class="bars">${list.map(t=>{const ev=events(t),good=ev.filter(e=>e[2]==='ok').length;return `<button class="g" onclick="openTool('${t.id}')" aria-label="Open ${esc(t.name)}, ${esc(LABEL[t.status])}"><div><s style="height:${Math.max(16,h(ev.length))}%"></s><s style="height:${Math.max(16,h(good))}%"></s></div><span>${esc(SHORT[t.id]||t.name)}</span></button>`}).join('')}</div>${list.length?'':'<p style="color:var(--mute)">No tool matches that.</p>'}</section>
 <section class="card half"><h3>Your tools</h3><div class="faces">${S.map(t=>`<button class="face ${live(t)?'':'off'}" onclick="openTool('${t.id}')" title="${esc(t.name)}" aria-label="Open ${esc(t.name)}">${svg(t.id)}</button>`).join('')}</div><div class="tri"><div><small>Places</small><b>${num(stat('maps',0))}</b></div><div><small>Products</small><b>${num(stat('nykaa',2))}</b></div><div><small>Rows converted</small><b>${num(stat('studio',1))}</b></div></div></section>
 <section class="card half b"><h3>Recent</h3>${E.slice(0,3).map(e=>`<div class="ev ${esc(e[2])}"><i></i><div>${esc(e[1])}: ${esc(e[3])}<small>${esc(e[0].slice(11,16))}</small></div></div>`).join('')||'<p style="color:var(--mute)">Nothing yet.</p>'}</section></div></div>`;set(html,html)}
function activity(){const html=`<div class="scroll"><div class="hd"><div><h1>Activity</h1><p>What each tool has collected, and what happened in the Hub.</p></div></div><div class="two"><div class="vstack">${S.map(t=>`<section class="card"><h3>${esc(t.name)} · ${esc(LABEL[t.status])}${t.uptime?' · '+fmtUp(t.uptime):''}</h3><div class="nums">${t.stats.map(s=>`<div><b>${num(s[1])}</b><span>${esc(s[0])}</span></div>`).join('')}</div></section>`).join('')}</div><section class="card"><h3>Events</h3>${E.map(e=>`<div class="ev ${esc(e[2])}"><i></i><div>${esc(e[1])}: ${esc(e[3])}<small>${esc(e[0].slice(5,16))}</small></div></div>`).join('')||'<p style="color:var(--mute)">Nothing yet.</p>'}</section></div></div>`;set(html,html)}
function details(t){const bad=(t.checks||[]).some(c=>!c[1]),a=!ready(t)?'':live(t)||busy(t)?`<button class="p on" onclick="openTool('${t.id}')">Open</button><button class="p" onclick="act('${t.id}','restart')">Restart</button><button class="p" onclick="act('${t.id}','stop')">Stop</button>`:`<button class="p on" onclick="openTool('${t.id}')">Start and open</button>`;
 const k=[t.id,t.status,JSON.stringify(t.stats),JSON.stringify(t.checks),Math.floor((t.uptime||0)/60)].join();
 if(!set(k,`<div class="scroll"><div class="hd"><div><h1>${esc(t.name)}</h1><p>${esc(t.desc)}</p></div>${a}</div><div class="two"><div class="vstack">
 ${bad?`<section class="card"><h3>Set up once</h3>${t.checks.map((c,i)=>`<div class="step"><span>${c[1]?'✓':i+1}</span><div><b style="font-weight:500">${esc(c[0])}</b>${c[1]?'':`<small>${esc(c[2])}</small>`}</div>${!c[1]&&c[3]?`<button class="p v" onclick="doAction('${t.id}','${c[3]}','log')">${esc((c[4]||'Set up').replace(/ \(needs Node\.js\)/,''))}</button>`:''}</div>`).join('')}</section>`:''}
 <section class="card"><h3>${esc(LABEL[t.status])}${t.uptime?' · '+fmtUp(t.uptime):''}</h3><div class="nums">${t.stats.map(s=>`<div><b>${num(s[1])}</b><span>${esc(s[0])}</span></div>`).join('')}</div></section>
 <section class="card"><h3>More</h3><div class="links">${t.actions.map(x=>`<button onclick="doAction('${t.id}','${x[0]}','${x[2]}')">${esc(x[1])}</button>`).join('')}${t.url?`<button onclick="window.open('${t.url}','_blank')">Open in browser</button>`:''}<button onclick="act('${t.id}','folder')">Open folder</button></div></section></div>
 <section class="card"><div class="ctop"><h3 style="flex:1">Live log</h3><button class="p" style="height:34px;padding:0 14px;background:var(--soft)" onclick="act('${t.id}','clear');logBuf['${t.id}']=[];drawLogs()">Clear</button></div><pre class="log" id="lg"></pre></section></div></div>`))return;drawLogs()}
function page(t){const want=live(t)?`${t.frame}/?theme=${theme()}`:'';set(t.id+want+t.status,`<div class="pgbar"><b>${esc(t.name)}</b><button class="p" onclick="tab='details';key='';render()">Details</button>${want?`<button class="p" onclick="key='';render()">Reload</button>`:''}${isOn(t)?`<button class="p" onclick="tab='details';act('${t.id}','stop');key='';render()">Stop</button>`:''}</div>`+(want?`<iframe class="frame" src="${want}" title="${esc(t.name)}"></iframe>`:`<div class="scroll"><section class="card"><h3>Starting ${esc(t.name)}…</h3><p style="color:var(--mute)">This page opens by itself.</p></section></div>`))}
function render(){chrome();$('#progress').classList.toggle('on',S.some(busy));const t=S.find(x=>x.id===cur);if(!t&&cur!=='activity')cur='home';if(t)return tab==='page'?page(t):details(t);cur==='home'?home():activity()}
async function pullLogs(){if(!S.some(t=>t.id===cur))return;const id=cur,rows=await fetch(`/api/logs?id=${id}&after=${logSeq[id]||0}`).then(r=>r.json()).catch(()=>[]);if(!rows.length)return;logSeq[id]=rows[rows.length-1][0];logBuf[id]=(logBuf[id]||[]).concat(rows).slice(-1500);if(id===cur)drawLogs()}
function drawLogs(){const el=$('#lg');if(!el)return;const stick=el.scrollTop+el.clientHeight>=el.scrollHeight-30;el.innerHTML=(logBuf[cur]||[]).map(r=>`<div><time>${r[1]}</time>${esc(r[2])}</div>`).join('')||'<span style="color:var(--mute)">No output yet</span>';if(stick)el.scrollTop=el.scrollHeight}
async function load(){try{[S,E]=await Promise.all([fetch('/api/state').then(r=>r.json()),fetch('/api/events').then(r=>r.json())]);$('#banner').hidden=true;if(!lastOk)key='';lastOk=true;render()}
 catch(e){if(lastOk){$('#banner').hidden=false;$('#banner').textContent='The Hub has stopped, and its tools with it. Start it again with launch.bat on Windows, launch.command on macOS or ./launch.sh on Linux. This page reconnects by itself.';S.forEach(t=>{t.status='stopped';t.uptime=0;t.pid=null});tab='details';key='';render()}lastOk=false}}
load();setInterval(load,2500);setInterval(pullLogs,1200);
</script></body></html>
