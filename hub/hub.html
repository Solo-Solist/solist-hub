/* Clean dashboard look: light grey shell, left sidebar, bordered white cards, one orange accent. */
:root{--page:#e9eaec;--shell:#f6f6f7;--panel:#fbfbfb;--card:#fff;--soft:#f3f3f4;--bar:#ececee;--hatch:#dcdce0;--on:#18181b;--mute:#71717a;--line:#e6e6e9;--v:#ff5b1f;--v2:#ffb08f;--v3:#ffd9c8;--vs:#fff1ea;--ink:#18181b;--on-ink:#fff;--ok:#15803d;--okbg:#e7f7ec;--err:#e11d48;--errbg:#ffe6ec;--logbg:#f8f8f9;--sh:0 1px 2px rgba(16,16,20,.04)}
[data-theme=dark]{--page:#09090b;--shell:#111114;--panel:#141417;--card:#1a1a1e;--soft:#232328;--bar:#2a2a30;--hatch:#34343b;--on:#f4f4f5;--mute:#a1a1aa;--line:#2a2a30;--v:#ff6a33;--v2:#b2532e;--v3:#5a2f1d;--vs:#3a1f12;--ink:#f4f4f5;--on-ink:#0b0b0d;--ok:#4ade80;--okbg:#15301f;--err:#fb7185;--errbg:#3b1620;--logbg:#121215;--sh:none;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--page);color:var(--on);font:14px/20px Urbanist,Outfit,Poppins,Nunito,"Noto Sans",Ubuntu,"Segoe UI",system-ui,sans-serif;overflow:hidden;padding:14px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}:focus-visible{outline:2px solid var(--v);outline-offset:2px}h1,h2,h3,p{margin:0}.sp{flex:1}
.shell{height:100%;display:grid;grid-template-columns:252px minmax(0,1fr);background:var(--shell);border-radius:22px;overflow:hidden;border:1px solid var(--line)}
/* sidebar */
.side{display:flex;flex-direction:column;gap:4px;padding:12px;overflow:auto;scrollbar-width:thin;min-height:0}
.brand{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--sh);margin-bottom:10px}
.brand .mk{width:36px;height:36px;border-radius:10px;background:var(--ink);display:grid;place-items:center;flex:none}.brand b{display:block;font-weight:600;font-size:14px;line-height:18px}.brand small{color:var(--mute);font-size:12px}
.sl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:14px 10px 6px}
.ni{position:relative;display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;color:var(--on);text-align:left;font-weight:500;transition:background .15s}
.ni:hover{background:var(--soft)}.ni.on{background:var(--card);box-shadow:var(--sh);border:1px solid var(--line);padding:7px 9px}.ni.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--v)}
.ni svg{color:var(--mute);flex:none}.ni.on svg{color:var(--on)}.ni span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni em{font-style:normal;font-size:11px;line-height:18px;padding:0 7px;border-radius:6px;background:var(--soft);color:var(--mute);flex:none}.ni em.live{background:var(--okbg);color:var(--ok)}.ni em.busy{background:var(--vs);color:var(--v)}
.sfoot{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:8px}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}.seg button{flex:1;height:30px;border-radius:7px;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:500;font-size:13px;padding:0 12px;white-space:nowrap}.seg button.on{background:var(--card);color:var(--on);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.promo{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;box-shadow:var(--sh)}.promo .mk{width:34px;height:34px;border-radius:9px;background:var(--v);color:#fff;display:grid;place-items:center;flex:none}.promo span{flex:1;font-weight:500;line-height:18px}.promo small{display:block;color:var(--mute);font-weight:400;font-size:12px}.promo>svg{color:var(--v)}
/* main */
.main{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);border-radius:18px 0 0 18px;margin:8px 0}
.top{display:flex;align-items:center;gap:8px;padding:16px 22px;border-bottom:1px solid var(--line);flex:none;min-width:0}
.top h1{font-size:24px;line-height:30px;font-weight:600;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none;color:var(--on)}.ib:hover{background:var(--soft)}
.faces{display:flex;align-items:center;margin-right:4px}.face{width:32px;height:32px;border-radius:50%;background:var(--vs);color:var(--v);display:grid;place-items:center;margin-left:-8px;border:2px solid var(--panel);flex:none}.face:first-child{margin-left:0}.face.more{background:var(--v3);color:var(--v);font-size:11px;font-weight:600}
.p{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-weight:500;flex:none;transition:background .15s;color:var(--on)}.p:hover{background:var(--soft)}.p.on,.p.k{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}.p.on:hover,.p.k:hover{opacity:.9}.p.v{background:var(--v);border-color:var(--v);color:#fff}
.scroll{flex:1;overflow:auto;padding:18px 22px 24px}
.hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 16px}.hd>p{color:var(--mute);flex:1 1 260px;min-width:0}
.vr{width:1px;height:26px;background:var(--line);margin:0 4px}
.search{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);width:200px;color:var(--mute)}.search input{border:0;outline:0;background:none;font:inherit;color:var(--on);width:100%;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;min-width:0;position:relative;box-shadow:var(--sh)}.pad{padding:16px 18px}
.card h3{font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;margin-bottom:12px}.card h3 svg{color:var(--mute)}
/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px;overflow:hidden}
.kpi{display:flex;flex-direction:column;border-left:1px solid var(--line);min-width:0}.kpi:first-child{border-left:0}
.kpi .in{padding:14px 16px 12px;position:relative;flex:1}.kpi h3{margin-bottom:8px}.kpi b{display:block;font-size:26px;line-height:34px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere;padding-right:72px}
.kpi .vs{color:var(--mute);font-size:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:3px;border-radius:6px;padding:0 6px;font-size:11px;font-weight:600;line-height:18px;background:var(--okbg);color:var(--ok)}.chip.dn{background:var(--errbg);color:var(--err)}.chip.n{background:var(--soft);color:var(--mute)}
.kpi .gl{position:absolute;right:14px;top:38px}
.more{display:flex;align-items:center;justify-content:center;gap:6px;border-top:1px solid var(--line);height:40px;font-weight:500;font-size:13px;width:100%}.more:hover{background:var(--soft)}

 return `<div class="pie"><svg width="150" height="150" viewBox="0 0 150 150" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r+8}" fill="none" stroke="var(--v3)" stroke-width="1.5"/>${slice}</svg>${a?`<em style="${lab(f,f/2)}">${pct(a,tot)}%</em>`:''}${b?`<em style="${lab(1-f,f+(1-f)/2)}">${pct(b,tot)}%</em>`:''}</div>`}
function home(){const q=query.trim().toLowerCase(),list=S.filter(t=>!q||(t.name+' '+t.desc).toLowerCase().includes(q)),on=S.filter(live),ready1=S.filter(ready).length,N=S.length;
 const events=t=>E.filter(e=>e[1]===t.name),counts=list.map(t=>{const ev=events(t);return [ev.length,ev.filter(e=>e[2]==='ok').length]});
 const mx0=Math.max(1,...counts.map(c=>c[0])),step=Math.max(1,Math.ceil(mx0/4)),mx=step*4,hi=counts.reduce((b,c,i)=>c[0]>(counts[b]||[0])[0]?i:b,0);
 const ok=E.filter(e=>e[2]==='ok').length,err=E.filter(e=>e[2]==='error').length,other=E.length-ok;
 const score=N?Math.round((ready1/N)*60+(on.length/N)*40):0,need=N-ready1;
 const kpi=(title,val,vs,glyph,more,to)=>`<section class="kpi"><div class="in"><h3>${esc(title)} ${svg('info',14)}</h3><b>${val}</b><div class="vs">${vs}</div>${glyph}</div><button class="more" onclick="go('${to}')">${esc(more)} ${svg('arrow',14)}</button></section>`;
 const lvl=n=>n<=0?'':n<=1?'l1':n<=3?'l2':'l3';
 const html=`<div class="scroll"><div class="hd"><div class="seg" role="tablist"><button class="on" role="tab" aria-selected="true">Overview</button><button role="tab" onclick="go('activity')">Activity</button></div><div class="vr"></div>
 <label class="search">${svg('search',16)}<input id="q" placeholder="Find a tool" aria-label="Find a tool" value="${esc(query)}" oninput="query=this.value;render()"></label><span class="sp"></span>
 <button class="p" onclick="stopAll()">${svg('power',16)}Stop all</button><button class="p k" onclick="startAll()">${svg('play',16)}Start all</button></div>
 <div class="card kpis">
 ${kpi('Tools running',`${on.length}<small style="font-size:15px;color:var(--mute);font-weight:500"> / ${N}</small>`,`right now <span class="chip ${on.length?'':'n'}">${on.length?'▲ ':''}${pct(on.length,N)}%</span>`,minibars(S.map(t=>[1+events(t).length,live(t)])),'See details','activity')}
 ${kpi('Tools ready',`${ready1}<small style="font-size:15px;color:var(--mute);font-weight:500"> / ${N}</small>`,need?`still to set up <span class="chip dn">${need}</span>`:`all set up <span class="chip">✓ ${N}</span>`,donut(N?ready1/N:0),'See details',(S.find(t=>!ready(t))||{id:'activity'}).id)}
 ${kpi('PDF tools',num(stat('pdf',0)),`in Solist PDF <span class="chip ${S.some(t=>t.id==='pdf'&&live(t))?'':'n'}">${S.some(t=>t.id==='pdf'&&live(t))?'On':'Off'}</span>`,spark,'See details','pdf')}
 ${kpi('Places found',num(stat('maps',0)),`in Maps Scraper <span class="chip ${S.some(t=>t.id==='maps'&&live(t))?'':'n'}">${S.some(t=>t.id==='maps'&&live(t))?'On':'Off'}</span>`,ticks,'See details','maps')}
 </div>
 <div class="card row2"><section class="gauge"><div class="in"><h3>Hub health ${svg('info',14)}</h3><div class="gw">${gauge(score/100)}<div><b>${score}</b> ${on.length?`<span class="chip">+${on.length}</span>`:''}<small>of 100 points</small></div></div><hr>
 <h4>${score>=80?'Your tools are in great shape ✨':score>=40?'Getting there':'Most tools are resting'}</h4><p>${need?`${need} tool${need===1?' still needs':'s still need'} a one-time setup. `:'Every tool is set up. '}${on.length?`${on.length} running now.`:'Nothing is running, so your PC stays free.'}</p></div>
 <button class="more" onclick="${need?`go('${(S.find(t=>!ready(t))||{}).id}')`:'startAll()'}">${need?'Finish setup':'Start everything'} ${svg('arrow',14)}</button></section>
 <section class="an"><div class="ctop"><h3>Analytics ${svg('info',14)}</h3><span class="lg"><span><i></i>All events</span><span><i class="v"></i>Selected</span></span><button class="p" onclick="go('activity')">${svg('filter',16)}All events</button></div>
 <div class="plot"><div class="ya">${[0,1,2,3,4].map(i=>`<span>${i*step}</span>`).join('')}</div><div class="pa"><div class="grid">${'<i></i>'.repeat(5)}</div><div class="bars">${list.map((t,i)=>{const [all,good]=counts[i],h=Math.max(9,all/mx*100);return `<button class="g ${i===hi?'hi':''}" onclick="openTool('${t.id}')" aria-label="Open ${esc(t.name)}, ${esc(LABEL[t.status])}, ${all} events"><div class="col"><s style="height:${h}%"><u style="height:${all?Math.round(good/all*100):0}%"></u><span class="tip ${i>=list.length/2&&list.length>1?'lt':''}"><small>${esc(t.name)}</small>Events<b>${all}</b><br>Successful<b>${good}</b><br>Status<b>${esc(LABEL[t.status])}</b></span></s></div><span>${esc(SHORT[t.id]||t.name)}</span></button>`}).join('')}</div></div></div>${list.length?'':'<p style="color:var(--mute)">No tool matches that.</p>'}</section></div>
 <div class="row3"><section class="card pad"><h3 style="justify-content:space-between">Tool status <span class="scale">Off <i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i> Busy</span></h3>
 <div class="heat"><span></span><span class="hh">Set up</span><span class="hh">Running</span><span class="hh">Events</span><span class="hh">Uptime</span>
 ${list.map(t=>{const n=events(t).length;return `<button class="tn" onclick="go('${t.id}')">${esc(t.name)}</button><i class="${ready(t)?'l2':''}" title="${ready(t)?'Set up':'Needs setup'}"></i><i class="${live(t)?'l3':busy(t)?'l2':''}" title="${esc(LABEL[t.status])}"></i><i class="${lvl(n)}" title="${n} events"></i><i class="${t.uptime>3600?'l3':t.uptime>600?'l2':t.uptime?'l1':''}" title="${t.uptime?fmtUp(t.uptime):'Off'}"></i>`}).join('')}</div></section>
 <section class="card pad"><h3>Hub events ${svg('info',14)}</h3><div class="tot"><div><b class="big">${E.length.toLocaleString()}</b><div class="vs">since the Hub started ${err?`<span class="chip dn">${err} failed</span>`:E.length?'<span class="chip">✓ no errors</span>':''}</div>
 <div class="kv"><i></i><span>Successful</span><b>${ok}</b></div><div class="kv"><i class="b"></i><span>Other</span><b>${other}</b></div>${E[0]?`<div class="ev ${esc(E[0][2])}" style="border-top:1px solid var(--line);padding-top:9px"><i></i><div>${esc(E[0][1])}: ${esc(E[0][3])}<small>${esc(E[0][0].slice(11,16))}</small></div></div>`:''}</div>${pie(ok,other)}</div></section></div></div>`;set(html,html)}
function activity(){const html=`<div class="scroll"><div class="hd"><div class="seg" role="tablist"><button role="tab" onclick="go('home')">Overview</button><button class="on" role="tab" aria-selected="true">Activity</button></div><p>What each tool has collected, and what happened in the Hub.</p></div><div class="two"><div class="vstack">${S.map(t=>`<section class="card pad"><h3>${svg(t.id,16)}${esc(t.name)} · ${esc(LABEL[t.status])}${t.uptime?' · '+fmtUp(t.uptime):''}</h3><div class="nums">${t.stats.map(s=>`<div><b>${num(s[1])}</b><span>${esc(s[0])}</span></div>`).join('')}</div></section>`).join('')}</div><section class="card pad"><h3>Events</h3>${E.map(e=>`<div class="ev ${esc(e[2])}"><i></i><div>${esc(e[1])}: ${esc(e[3])}<small>${esc(e[0].slice(5,16))}</small></div></div>`).join('')||'<p style="color:var(--mute)">Nothing yet.</p>'}</section></div></div>`;set(html,html)}
function details(t){const bad=(t.checks||[]).some(c=>!c[1]),a=!ready(t)?'':live(t)||busy(t)?`<button class="p k" onclick="openTool('${t.id}')">${svg('open',16)}Open</button><button class="p" onclick="act('${t.id}','restart')">Restart</button><button class="p" onclick="act('${t.id}','stop')">${svg('power',16)}Stop</button>`:`<button class="p v" onclick="openTool('${t.id}')">${svg('play',16)}Start and open</button>`;
 const k=[t.id,t.status,JSON.stringify(t.stats),JSON.stringify(t.checks),Math.floor((t.uptime||0)/60)].join();
 if(!set(k,`<div class="scroll"><div class="hd"><p>${esc(t.desc)}</p>${a}</div><div class="two"><div class="vstack">
 ${bad?`<section class="card pad"><h3>Set up once</h3>${t.checks.map((c,i)=>`<div class="step"><span>${c[1]?'✓':i+1}</span><div><b style="font-weight:500">${esc(c[0])}</b>${c[1]?'':`<small>${esc(c[2])}</small>`}</div>${!c[1]&&c[3]?`<button class="p v" onclick="doAction('${t.id}','${c[3]}','log')">${esc((c[4]||'Set up').replace(/ \(needs Node\.js\)/,''))}</button>`:''}</div>`).join('')}</section>`:''}
 <section class="card pad"><h3>${esc(LABEL[t.status])}${t.uptime?' · '+fmtUp(t.uptime):''}</h3><div class="nums">${t.stats.map(s=>`<div><b>${num(s[1])}</b><span>${esc(s[0])}</span></div>`).join('')}</div></section>
 <section class="card pad"><h3>More</h3><div class="links">${t.actions.map(x=>`<button onclick="doAction('${t.id}','${x[0]}','${x[2]}')">${esc(x[1])}</button>`).join('')}${t.url?`<button onclick="window.open('${t.url}','_blank')">Open in browser</button>`:''}<button onclick="act('${t.id}','folder')">Open folder</button></div></section></div>
 <section class="card pad"><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><h3 style="flex:1;margin:0">Live log</h3><button class="p" style="height:32px;padding:0 12px" onclick="act('${t.id}','clear');logBuf['${t.id}']=[];drawLogs()">Clear</button></div><pre class="log" id="lg"></pre></section></div></div>`))return;drawLogs()}
function page(t){const want=live(t)?`${t.frame}/?theme=${theme()}`:'';set(t.id+want+t.status,`<div class="pgbar"><p>${esc(t.desc)}</p><button class="p" onclick="tab='details';key='';render()">Details</button>${want?`<button class="p" onclick="key='';render()">Reload</button>`:''}${isOn(t)?`<button class="p" onclick="tab='details';act('${t.id}','stop');key='';render()">${svg('power',16)}Stop</button>`:''}</div>`+(want?`<iframe class="frame" src="${want}" title="${esc(t.name)}" allow="cross-origin-isolated; clipboard-read; clipboard-write"></iframe>`:`<div class="scroll"><section class="card pad"><h3>Starting ${esc(t.name)}…</h3><p style="color:var(--mute)">This page opens by itself.</p></section></div>`))}
function render(){const t=S.find(x=>x.id===cur);if(!t&&cur!=='activity')cur='home';chrome();$('#progress').classList.toggle('on',S.some(busy));if(t)return tab==='page'?page(t):details(t);cur==='home'?home():activity()}
async function pullLogs(){if(!S.some(t=>t.id===cur))return;const id=cur,rows=await fetch(`/api/logs?id=${id}&after=${logSeq[id]||0}`).then(r=>r.json()).catch(()=>[]);if(!rows.length)return;logSeq[id]=rows[rows.length-1][0];logBuf[id]=(logBuf[id]||[]).concat(rows).slice(-1500);if(id===cur)drawLogs()}
function drawLogs(){const el=$('#lg');if(!el)return;const stick=el.scrollTop+el.clientHeight>=el.scrollHeight-30;el.innerHTML=(logBuf[cur]||[]).map(r=>`<div><time>${r[1]}</time>${esc(r[2])}</div>`).join('')||'<span style="color:var(--mute)">No output yet</span>';if(stick)el.scrollTop=el.scrollHeight}
async function load(){try{[S,E]=await Promise.all([fetch('/api/state').then(r=>r.json()),fetch('/api/events').then(r=>r.json())]);$('#banner').hidden=true;if(!lastOk)key='';lastOk=true;render()}
 catch(e){if(lastOk){$('#banner').hidden=false;$('#banner').textContent='The Hub has stopped, and its tools with it. Start it again with launch.bat on Windows, launch.command on macOS or ./launch.sh on Linux. This page reconnects by itself.';S.forEach(t=>{t.status='stopped';t.uptime=0;t.pid=null});tab='details';key='';render()}lastOk=false}}
load();setInterval(load,2500);setInterval(pullLogs,1200);
</script></body></html>
